<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Working the CP Way</title>
  <!-- โหลด Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- โหลด Font Kanit -->
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <!-- โหลดไฟล์ CSS ของเรา -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="font-['Kanit',sans-serif] bg-[#F4F7FA] text-gray-800 min-h-screen flex flex-col md:flex-row overflow-hidden selection:bg-[#D4AF37] selection:text-[#002855]">

  <!-- Mobile Header -->
  <div class="md:hidden bg-[#002855] text-white p-4 flex justify-between items-center shadow-md z-20 relative">
    <div class="font-bold text-[#D4AF37] truncate flex-1">Working the CP Way</div>
    <button onclick="toggleSidebar()" class="p-1 focus:outline-none">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
    </button>
  </div>

  <!-- Sidebar Overlay (Mobile) -->
  <div id="sidebar-overlay" class="hidden md:hidden fixed inset-0 bg-black/50 z-20" onclick="toggleSidebar()"></div>

  <!-- Sidebar Navigation -->
  <div id="sidebar" class="-translate-x-full md:translate-x-0 transition-transform duration-300 fixed md:static top-0 left-0 h-full w-72 bg-[#001A36] text-white z-30 flex flex-col shadow-2xl">
    <div class="p-6 border-b border-white/10 hidden md:block text-center">
      <div class="w-12 h-12 mx-auto bg-[#D4AF37] rounded-full flex items-center justify-center mb-3">
         <span class="text-[#002855] font-black text-xl">CP</span>
      </div>
      <h1 class="font-bold text-lg text-white">Working the CP Way</h1>
      <p class="text-xs text-gray-400">E-Book for Newbies</p>
    </div>
    
    <div class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-1" id="sidebar-menu">
      <div class="text-xs font-bold text-gray-400 mb-3 px-2 uppercase tracking-wider">Table of Contents</div>
      <!-- ปุ่มเมนูจะถูกสร้างโดย Javascript -->
    </div>
    
    <div class="md:hidden p-4 border-t border-white/10">
      <button onclick="toggleSidebar()" class="w-full bg-white/10 py-2 rounded text-sm hover:bg-white/20">Close Menu</button>
    </div>
  </div>

  <!-- Main Content Area -->
  <div class="flex-1 flex flex-col h-screen md:h-auto overflow-hidden relative">
    <div class="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar scroll-smooth flex justify-center pb-24 md:pb-8">
      <div class="max-w-3xl w-full h-full">
        <!-- Wrapper สำหรับแต่ละหน้า -->
        <div id="page-wrapper" class="h-full bg-white md:rounded-2xl md:shadow-xl md:p-8 p-4 border border-gray-100 flex flex-col animate-fade-in-up">
          
          <!-- เนื้อหาของเพจต่างๆ จะถูกสลับแสดงที่นี่ผ่าน Javascript -->
          <div id="content-container" class="h-full"></div>

        </div>
      </div>
    </div>

    <!-- Bottom Navigation Control -->
    <div class="absolute bottom-0 left-0 w-full bg-white border-t border-gray-200 p-4 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-10">
      <div class="max-w-3xl mx-auto flex items-center justify-between">
        <button id="btn-prev" onclick="handlePrev()" class="flex items-center gap-2 px-4 py-2 rounded-full font-medium transition-colors text-gray-400 cursor-not-allowed" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg> 
          <span class="hidden sm:inline">หน้าก่อนหน้า</span>
        </button>
        
        <div id="page-indicator" class="text-sm font-medium text-gray-500 bg-gray-100 px-4 py-1.5 rounded-full">
          หน้า 1 / 11
        </div>
        
        <button id="btn-next" onclick="handleNext()" class="flex items-center gap-2 px-4 py-2 rounded-full font-medium transition-colors text-white bg-[#002855] hover:bg-[#001A36] shadow-md">
          <span class="hidden sm:inline">หน้าถัดไป</span> 
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- โหลดไฟล์ Javascript ของเรา -->
  <script src="script.js"></script>
</body>
</html>
